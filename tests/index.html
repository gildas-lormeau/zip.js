<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>zip.js tests</title>
    <style>
        body {
            font-family: monospace;
        }

        #status {
            margin-bottom: 8px;
        }

        #status.passed,
        tr.passed {
            color: green;
        }

        #status.failed,
        tr.failed {
            color: red;
        }

        iframe {
            display: block;
            height: 1.2em;
            border-width: 0;
            margin-left: 8px;
            width: 30px;
        }
    </style>
</head>

<body>
    <div id="status"></div>
    <table id="tests"></table>
    <script src="web-runner.js" type="module"></script>
</body>

</html>
