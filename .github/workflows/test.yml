name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# superseded runs are only cancelled on pull request branches: on master every run may be the one the
# publish gate polls, and cancelling it fails the release of the commit it was testing
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # the version is declared by hand in four files, and nothing kept them in agreement: v2.8.53 was
      # tagged with package.json and deno.json at 2.8.53 while package-lock.json still read 2.8.52. it
      # runs before the install because it only reads the files
      - name: Verify the declared versions agree
        run: |
          version=$(jq -r .version package.json)
          for file in deno.json package-lock.json; do
            other=$(jq -r .version $file)
            if [ "$other" != "$version" ]; then
              echo "::error::$file declares $other, package.json declares $version"
              exit 1
            fi
          done
          other=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' lib/core/version.js)
          if [ "$other" != "$version" ]; then
            echo "::error::lib/core/version.js declares $other, package.json declares $version"
            exit 1
          fi

      # npm ci instead of npm install: both freshness checks below regenerate committed files, so the
      # build must run against the locked dependency versions, otherwise a caret-range resolution alone
      # turns them red
      - name: Install dependencies
        run: npm ci

      - name: Verify no code issue
        run: npx eslint .

      # the browser jobs are the only ones running the suite, and they run on macOS and Windows, whose
      # filesystems are case-insensitive: a test registered under a name differing only by its case
      # resolved there and threw ERR_MODULE_NOT_FOUND on Linux. this compares the names as strings
      - name: Verify the tests are registered
        run: npm run test-registration

      - name: Verify markdown doc is up to date
        run: |
          npm run build-doc-markdown
          git diff --exit-code docs

      # the release workflow publishes the committed files as they are, it never rebuilds, so a stale
      # dist/ or index.min.js at a tag ships to npm and JSR. Pull requests are exempt: asking outside
      # contributors to commit build output would add an unreviewable diff to every change
      - name: Verify build output is up to date
        if: github.event_name == 'push'
        run: |
          npm run build
          git diff --exit-code

  # the browser jobs below are the only other ones running the suite, and they run browsers: the node,
  # deno and bun runners, the dist variants, the TypeScript definitions and the api-symmetry audits
  # were enforced by nothing but whoever remembered to run `npm test` before pushing. this job is also
  # the only one on a case-sensitive filesystem, which is where a mismatched filename actually fails
  runtimes:
    name: 'Test node, deno and bun'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test:
    name: Test ${{ matrix.browser }} ${{ matrix.version }}${{ format(matrix.build && ' ({0})' || '', matrix.build) }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chrome
            version: 'latest'
          - os: windows-latest
            browser: chrome
            version: '87.0.4279.4'
            position: '811961'
            search: 'maxParallelTests=4'
          - os: windows-latest
            browser: chrome
            version: '76.0.3808.4'
            position: '664573'
          - os: windows-latest
            browser: firefox
            version: 'latest'
          - os: windows-latest
            browser: firefox
            version: '102.0.1'
          - os: windows-latest
            browser: firefox
            version: '79.0'
            search: 'withStreamsPolyfill'
          # safari loses its WebDriver session probabilistically on the 3-core mac tier, on both
          # images (actions/runner-images#14585, closed without a fix); macos-15 fails measurably
          # less often than macos-26, and browser-runner.js retries the suite with a fresh browser
          - os: macos-15
            browser: safari
            version: 'latest'

          # native build
          - os: windows-latest
            browser: chrome
            version: '87.0.4279.4'
            position: '811961'
            search: 'maxParallelTests=4'
            build: 'native'
          - os: windows-latest
            browser: chrome
            version: '76.0.3808.4'
            position: '664573'
            build: 'native'
          - os: windows-latest
            browser: firefox
            version: '102.0.1'
            build: 'native'
          - os: windows-latest
            browser: firefox
            version: '71.0'
            build: 'native'
            search: 'withStreamsPolyfill'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Set up browser
        shell: pwsh
        run: |
          $browser = "${{ matrix.browser }}"
          $version = "${{ matrix.version }}"
          $targetDir = "$env:USERPROFILE/browsers"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null

          if ($browser -eq "chrome") {
            if ($version -ne "latest") {
              if ([version]$version -ge [version]"113.0") {
                # Use Chrome for Testing when available
                # https://googlechromelabs.github.io/chrome-for-testing/
                $appSrc = "https://storage.googleapis.com/chrome-for-testing-public/${version}/win64/chrome-win64.zip"
                $appSubpath = "chrome-win64/chrome.exe"
                echo "appSrc: $appSrc"
                echo "appSubpath: $appSubpath"
              }
              else {
                # Use a portable chromium snapshot, located by the position pinned in the matrix
                # https://www.chromium.org/getting-involved/download-chromium/
                $position = "${{ matrix.position }}"
                $appSrc = "https://www.googleapis.com/download/storage/v1/b/chromium-browser-snapshots/o/Win_x64%2F${position}%2Fchrome-win.zip?alt=media"
                $appSubpath = "chrome-win/chrome.exe"
                echo "appSrc: $appSrc"
                echo "appSubpath: $appSubpath"
              }

              $appZip = "$targetDir/chrome.zip"
              $appDir = "$targetDir/chrome"
              Invoke-WebRequest -Uri $appSrc -OutFile $appZip
              Expand-Archive -Path $appZip -DestinationPath $appDir -Force
              echo "EXE_PATH=$appDir/$appSubpath" >> $env:GITHUB_ENV
            }
          }
          elseif ($browser -eq "firefox") {
            if ($version -ne "latest") {
              $appSrc = "https://ftp.mozilla.org/pub/firefox/releases/$version/win64/en-US/Firefox%20Setup%20$version.exe"
              $appSubpath = "core/firefox.exe"
              echo "appSrc: $appSrc"
              echo "appSubpath: $appSubpath"

              $appFile = "$targetDir/firefox-setup.exe"
              $appDir = "$targetDir/firefox"
              Invoke-WebRequest -Uri $appSrc -OutFile $appFile
              7z x $appFile -o"$appDir" -y | Out-Null
              echo "EXE_PATH=$appDir/$appSubpath" >> $env:GITHUB_ENV
            }
          }
          elseif ($browser -eq "safari") {
            sudo safaridriver --enable
          }

      - name: Run tests
        shell: pwsh
        run: |
          $browser = "${{ matrix.browser }}"

          $argsList = @($browser)

          if ($env:EXE_PATH) {
            $argsList += "--exe-path"
            $argsList += "$env:EXE_PATH"
          }

          $urlSearch = "${{ matrix.search }}"
          if ($urlSearch) {
            $argsList += "--url-search"
            $argsList += "$urlSearch"
          }

          $build = "${{ matrix.build }}"
          if ($build) {
            $argsList += "--build"
            $argsList += "$build"
          }

          if ($browser -eq "chrome") {
            # Skip the preinstalled browser drivers in PATH and let selenium determine
            # according to the passed executable.
            $env:SE_SKIP_DRIVER_IN_PATH = "true"
          }

          node tests/browser-runner.js $argsList
